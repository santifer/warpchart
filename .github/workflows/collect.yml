name: collect
on:
  schedule:
    # Every 2h: the snapshot lives in the PRIVATE Blob (the moat), never in git.
    # A tiny .deploy-stamp commit triggers the Vercel build, whose prebuild
    # pulls data/ back down from the Blob. Live polling + /api/live/locals cover
    # the real-time layer between builds. :07 avoids the :00 Actions congestion.
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      force_v7:
        description: "Recompute v7 even if route.json has not refreshed (use after fixing the velocity math)"
        type: boolean
        default: false
      force_collisions:
        description: "Re-scan overtakes for the current registry (use after fixing how crossings are scored)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Room for every step's own cap to apply BEFORE the job's: a job-level
    # timeout cancels the remaining steps silently (that is what killed
    # 'Trigger deploy' and froze the site on 2026-07-19), whereas a step-level
    # one is contained and visible.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # @vercel/blob is the only dependency the sync scripts need (the collector
      # itself is built-ins only).
      - run: npm install @vercel/blob --no-save --no-audit --no-fund

      # 1. Hydrate data/ from the PRIVATE Blob store — the accumulated history
      #    no longer lives in git, so the collector reads its prior state here.
      - name: Hydrate data from private Blob
        run: node scripts/sync-from-blob.mjs
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      # 2. Guard: never collect on top of the demo sample. A failed hydrate
      #    falls back to data-sample/; appending to it and mirroring back would
      #    overwrite the real moat. Abort instead.
      - name: Verify real data hydrated
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('./data/meta.json','utf8'));if(m.repo==='warpchart/sample'){console.error('hydrate fell back to sample — aborting to protect the Blob moat');process.exit(1)}console.log('hydrated: '+m.repo)"

      # 3. Collect one snapshot (appends to the hydrated data/).
      - name: Collect snapshot
        run: node collector/collect.mjs
        env:
          # The automatic Actions token used to cover every public-data read the
          # collector needs. It no longer does: since GitHub restricted stargazer
          # access, an installation token gets FORBIDDEN ("Resource not
          # accessible by integration") on `stargazers`, which silently froze the
          # tenant's daily star series on 2026-07-22 while every other number
          # kept updating. A USER-scoped token can still read them, so prefer one
          # and keep the Actions token as the fallback that covers everything
          # else (a fork with no secrets still works, minus the per-star series).
          GH_TOKEN: ${{ secrets.STARGAZER_TOKEN || secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          # Every other token we have, so the collector can fail over per CALL
          # when the preferred one is FORBIDDEN for that endpoint. Configuring
          # the "right" secret is not something anyone should have to get right:
          # a fine-grained PAT cannot read stargazers at all, and it is
          # indistinguishable from a working one until a call 403s.
          GH_TOKEN_FALLBACKS: ${{ secrets.TRAFFIC_TOKEN }} ${{ secrets.GITHUB_TOKEN }}
          # Optional: a Discord or Slack incoming-webhook URL for milestone /
          # overtake alerts.
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          WARM_BASE_URL: ${{ vars.WARM_BASE_URL }}

      # 3b. Stabilise route.json velocity: add a 7-day rate (`v7`) per repo from
      #     the rank-history shards, so every consumer that reads route velocity
      #     inherits ONE stable number instead of the noisy ~1-day `v`. Additive
      #     (never touches `v`), idempotent per route refresh, never fails the run.
      - name: Stabilise route velocity (7-day)
        run: node collector/velocity7.mjs
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          V7_FORCE: ${{ inputs.force_v7 && '1' || '' }}

      # 3b-bis. Imminent overtakes. MUST run after velocity7: it used to run
      #     inside collect.mjs, before `v7` existed, so every crossing was scored
      #     with the noisy 1-day rate and /api/v1/overtakes publicly contradicted
      #     /api/v1/velocity for the same repo. Self-skips when the registry did
      #     not refresh (the baseline diff needs two generations).
      - name: Scan imminent overtakes
        run: node collector/collisions.mjs ${{ inputs.force_collisions && '--force' || '' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WARM_BASE_URL: ${{ vars.WARM_BASE_URL }}

      # 3c. Ping IndexNow (Bing/Yandex) with the refreshed corpus so new charted
      #     repos and the daily rank/velocity updates get crawled in hours. Once
      #     per UTC day (the stamp syncs to Blob below); never fails the run.
      - name: Submit corpus to IndexNow
        run: node collector/indexnow.mjs
        continue-on-error: true

      # 4. Mirror the updated data/ back UP to the private Blob — the moat.
      - name: Mirror data to private Blob
        run: node scripts/sync-to-blob.mjs
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      # 4b. Record one daily point of the worldwide top-10k rank distribution
      #     into the private Blob (route-history/shard-*.json). The un-backfillable
      #     moat: any top-10k repo's world-rank-over-time, ready at pay-time.
      #     Idempotent on the UTC day (checks meta before the ~100-call deep
      #     sweep); never allowed to fail the run.
      - name: Record rank-distribution history
        run: node collector/route-history.mjs
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4b-bis. Build the daily rising-by-category catalog (data/catalog.json in
      #     the private Blob) from its own shallow top-3000 sweep. Powers /c,
      #     /api/v1/rising, the get_rising MCP tool and the CLI. Self-gates to
      #     once per UTC day; never allowed to fail the run.
      - name: Build rising catalog
        run: node collector/catalog.mjs
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4c. Traffic Vault: snapshot each tracked repo's GitHub traffic (views,
      #     clones, referrers) into the private Blob and keep it forever. GitHub
      #     deletes it after 14 days. Needs a per-repo owner token (TRAFFIC_TOKEN
      #     or TRAFFIC_TOKENS); no token just no-ops. Never fails the run.
      - name: Snapshot Traffic Vault
        run: node collector/traffic.mjs
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          TRAFFIC_TOKENS: ${{ secrets.TRAFFIC_TOKENS }}

      # 4c-pre. Contributor census for the unlocked repos: WHO ever landed a
      #     commit and WHEN their first one landed, from the full commit history
      #     (complete AND dated, unlike every capped contributors endpoint).
      #     Feeds the vitals cohorts as a census with no window - defusing the
      #     want=1000 PR-sample bomb (career-ops crosses it ~late September).
      #     Incremental after the first backfill (~1-2 calls/run). MUST run
      #     BEFORE Vital Signs so phase B reads a fresh store.
      - name: Contributor census
        run: node collector/contributors.mjs
        continue-on-error: true
        timeout-minutes: 4
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.STARGAZER_TOKEN || secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN_FALLBACKS: ${{ secrets.TRAFFIC_TOKEN }} ${{ secrets.GITHUB_TOKEN }}

      # 4c-bis. Vital Signs: the derived-intelligence moat. Refresh the top-N
      #     activity DISTRIBUTION (commits/PRs/issues/releases/velocity) once per
      #     UTC day, then compute full vitals (activity percentile + DORA lead
      #     time + clone-conversion + ALIVE/MONUMENT verdict) for the OWNED repos
      #     and PAID tenants -> vitals/{owner}--{name}.json. Runs AFTER velocity7
      #     (route v7) and traffic.mjs (the vault). Self-gates per day; never
      #     fails the run. VITALS_UNIVERSE caps the distribution set.
      # The 3-minute cap added on 2026-07-23 stopped this step from starving
      # 'Trigger deploy', but it also guaranteed it could never finish: the
      # distribution sweep restarted from zero each run and was killed before
      # writing, taking Phase B (the panel refresh) with it. The sweep is now
      # resumable with its own internal budget, so the cap only has to leave
      # room for that budget plus Phase B.
      - name: Compute Vital Signs
        run: node collector/vitals.mjs
        continue-on-error: true
        timeout-minutes: 5
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.STARGAZER_TOKEN || secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN_FALLBACKS: ${{ secrets.TRAFFIC_TOKEN }} ${{ secrets.GITHUB_TOKEN }}
          VITALS_UNIVERSE: "1000"
          VITALS_DEADLINE_MS: "150000"

      # 4c-ter. Owner standing: follower count + worldwide rank into the PRIVATE
      #     Blob (private/followers.json). Follower history cannot be backfilled
      #     (GitHub publishes one integer and no series), so every skipped run is
      #     a day that can never be recovered. Deliberately NOT public: the key
      #     sits outside the `data/` prefix the sync mirrors and outside the
      #     `codex/` prefix anything enumerates, and no route reads it.
      - name: Snapshot owner standing (private)
        run: node collector/followers.mjs
        continue-on-error: true
        timeout-minutes: 2
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.STARGAZER_TOKEN || secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN_FALLBACKS: ${{ secrets.TRAFFIC_TOKEN }} ${{ secrets.GITHUB_TOKEN }}
          FOLLOWERS_LOCATION: spain

      # 4c-quater. Install waves. `npx @santifer/career-ops init` CLONES the repo,
      #     so an agent-mediated campaign shows up ONLY as unique cloners: no page
      #     view, no star, no referrer. On 2026-08-01 that was 15,626 cloners from
      #     one LinkedIn post and the dashboard read it as a quiet Saturday.
      #     Classifies each closed day against a MAD baseline and pages only for
      #     waves; machine loops (CI/mirrors looping) are recorded, not paged.
      #     Runs AFTER traffic.mjs so it reads the freshest vault.
      - name: Detect install waves
        run: node collector/installs.mjs
        continue-on-error: true
        timeout-minutes: 2
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}

      # 4d. Spike attribution: detect HOURLY star surges from the fresh timestamps
      #     and name each one by diffing the Traffic Vault referrer snapshots that
      #     bracket it ("+67 stars at 11h · Twitter"). Writes data/attribution.json
      #     to the Blob; the bundle merges it into the house Mission Log. Runs
      #     AFTER traffic.mjs so the freshest referrer snapshot is in the diff.
      - name: Attribute spikes
        run: node collector/attribute.mjs
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      # 5. No data in git: a tiny stamp commit triggers the Vercel build, whose
      #    prebuild pulls the fresh data/ from the Blob.
      - name: Trigger deploy
        run: |
          git config user.name "warpchart-bot"
          git config user.email "warpchart-bot@users.noreply.github.com"
          date -u +%FT%H:%MZ > .deploy-stamp
          git add .deploy-stamp
          git diff --cached --quiet || {
            git commit -m "deploy $(date -u +%FT%H:%MZ)"
            git pull --rebase
            git push
          }

      # 6. Mutual attestation. health.yml checks production; this checks that
      #    health.yml is still running at all - otherwise a stopped watchdog is
      #    indistinguishable from a healthy system, since both are silent.
      #    LAST, and deliberately WITHOUT continue-on-error: a red run mails the
      #    owner, and by this point the deploy has already shipped, so failing
      #    here costs nothing but attention.
      - name: Verify the watchdog is alive
        run: node collector/watchdog-alive.mjs
        timeout-minutes: 1
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
